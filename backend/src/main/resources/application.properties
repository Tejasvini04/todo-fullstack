spring.application.name=todo-backend

spring.datasource.url=jdbc:mysql://localhost:3306/todo_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=00000000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
app.jwt.expiration-ms=86400000

server.port=${PORT:8080}